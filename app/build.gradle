plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orange.sudoku'
    compileSdk 34

    defaultConfig {
        applicationId 'com.orange.sudoku'
        minSdk 26          // Android 8.0 及以上（2017 年后机型）
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // 纯离线单机游戏：不申请任何权限，不需要网络
    }

    // 个人自用签名，保证每次构建出的 APK 签名一致，可以覆盖安装升级
    signingConfigs {
        release {
            storeFile file('../keystore/sudoku.jks')
            storePassword 'sudoku123'
            keyAlias 'sudoku'
            keyPassword 'sudoku123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // HTML 不压缩，方便直接替换 assets/sudoku.html 更新游戏
    androidResources {
        noCompress 'html'
    }
}
